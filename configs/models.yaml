# Unified Model Registry (validated against minorsafe.config.ModelSpec)

# ===========================================================================
# 0. CPU Debug / Smoke Models (tiny random weights for fast CI and smoke runs)
# ===========================================================================
tiny_llama:
  hf_id: hf-internal-testing/tiny-random-LlamaForCausalLM
  arch: decoder
  role: generator
  family: llama
  size_group: S
  params_b: 0.01
  chat_template: false
  supports_system: true
  notes: "Tiny random causal LM for CPU unit/integration/smoke tests."

tiny_bert:
  hf_id: hf-internal-testing/tiny-random-BertForSequenceClassification
  arch: encoder
  role: encoder_guard
  family: bert
  size_group: S
  params_b: 0.005
  chat_template: false
  notes: "Tiny random encoder classifier for CPU tests."

tiny_mlm:
  hf_id: hf-internal-testing/tiny-random-BertForMaskedLM
  arch: encoder
  role: encoder_mlm
  family: bert
  size_group: S
  params_b: 0.005
  chat_template: false
  notes: "Tiny random MLM encoder for CPU recomposition tests."

