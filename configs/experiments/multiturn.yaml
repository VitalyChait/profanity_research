name: multiturn
description: "Optional extension (not core): 5-7 turn gradual conversational drift dialogues (data/multiturn.py); each method answers the final, drifted user turn with the whole conversation as context."
split: dev
eval_set: multiturn_drift
seeds: [0]
age_bands: ["teen_12_18"]
temperature: 0.0
warmup_queries: 1
evaluate: true
capability_eval: false
runs:
  - method: m0a_raw
    generators: ["M", "L"]
  - method: m3_steer_swfc
    generators: ["M", "L"]
  - method: m3_steer_sttp
    generators: ["M", "L"]
  - method: m3_probe_guard
    generators: ["M", "L"]
