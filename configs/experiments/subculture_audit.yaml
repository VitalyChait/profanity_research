name: subculture_audit
description: "Subcultural language evolution & structural dataset corruption study (benign teen slang vs obfuscated/emoji profanity)."
split: test
categories: ["slang", "benign_tricky", "obfuscated", "profanity"]
seeds: [0]
age_bands: ["teen_12_18"]
temperature: 0.0
warmup_queries: 2
evaluate: true
capability_eval: false
runs:
  - method: m0a_raw
    generators: ["*"]
  - method: m0b_sysprompt
    generators: ["*"]
  - method: m1_encoder_guard
    generators: ["*"]
    params:
      train_mode: zeroshot
      action: fallback
    label: m1_enc_zeroshot
  - method: m1_encoder_guard
    generators: ["*"]
    params:
      train_mode: finetuned
      action: mlm_substitute
    label: m1_enc_finetuned
  - method: m1_decoder_guard
    generators: ["*"]
    params:
      action: llm_rewrite
  - method: m2_lora
    generators: ["*"]
  - method: m3_steer_sttp
    generators: ["*"]
  - method: m3_steer_ortho
    generators: ["*"]
